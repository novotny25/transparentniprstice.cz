# Nasazení webu Transparentní Prštice
# Statický web bez buildu — publikuje se rovnou složka web/

[build]
  publish = "web"
  command = ""

# Bezpečnostní hlavičky (statický web, žádné externí zdroje)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# Náhledové (deploy preview) verze se nesmí indexovat
[context.deploy-preview]
  [context.deploy-preview.headers]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex"
