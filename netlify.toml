# Nasazení webu Transparentní Prštice
# Statický web bez buildu — publikuje se rovnou složka web/

[build]
  publish = "web"

# Bezpečnostní hlavičky (statický web, žádné externí zdroje)
[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-src 'self'; base-uri 'self'; frame-ancestors 'self'"

# Náhledové verze (deploy preview) se nesmí indexovat
[[context.deploy-preview.headers]]
  for = "/*"

  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

# PDF se mají v prohlížeči ZOBRAZIT, ne stáhnout.
# Přísná CSP hlavní stránky by blokovala vestavěný prohlížeč PDF, proto tu má
# dokument vlastní, volnější politiku (PDF neobsahuje spustitelný obsah webu).
[[headers]]
  for = "/dokumenty/*"

  [headers.values]
    Content-Disposition = "inline"
    Content-Security-Policy = "default-src 'self'; object-src 'self'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"

# Manuál v Markdownu: nabídnout ke stažení, ale umožnit i zobrazení
[[headers]]
  for = "/dokumenty/*.md"

  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Content-Disposition = "inline"

# Kanonická podoba adres je s .html (odpovídá sitemap a canonical);
# krátké adresy přesměrovat trvale, ať neexistují dvě verze téže stránky.
[[redirects]]
  from = "/obec"
  to = "/obec.html"
  status = 301

[[redirects]]
  from = "/rizeni"
  to = "/rizeni.html"
  status = 301

[[redirects]]
  from = "/jak-to-vime"
  to = "/jak-to-vime.html"
  status = 301

[[redirects]]
  from = "/pro-dalsi-obce"
  to = "/pro-dalsi-obce.html"
  status = 301

[[redirects]]
  from = "/o-webu"
  to = "/o-webu.html"
  status = 301

