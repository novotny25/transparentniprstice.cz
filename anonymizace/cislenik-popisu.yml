# ══════════════════════════════════════════════════════════════════════
#  ANALYTICKÁ TÉMATA PRO ROZKLAD ZMĚN — účet 518
#
#  POZOR: tenhle číselník NENÍ náhradou veřejného popisu. Veřejný popis
#  zápisu je původní text obce (viz popisy-zasahy.yml pro výjimky). Kódy
#  níže slouží jen k SESKUPENÍ zápisů do témat, aby šlo spočítat, co
#  tvořilo meziroční rozdíl (úkol 1.7). Ve veřejných datech položek se
#  kód nezobrazuje.
#
#  Jak se kód přiřadí: skript projde kódy shora dolů a přiřadí první,
#  jehož klíčové slovo je obsaženo v původním popisu (po odstranění
#  diakritiky a velikosti písmen). Když nezabere žádný, použije se
#  fallback podle účetní kategorie. Fallback je bezpečná síť — i bez
#  shody je označení věcné a bez osobních údajů.
#
#  Pořadí proto ROZHODUJE: specifická témata jsou nahoře, obecná dole.
#
#  Vzniklo v úkolu 1.1. Schvaluje Petr (úkol 1.7 čísla i kategorie
#  ještě zpřesní).
# ══════════════════════════════════════════════════════════════════════

