# ──────────────────────────────────────────────────────────────────────
# Zámek kategorie — kde je účetní kategorie spolehlivější než volný popis.
# Zápis v těchto kategoriích dostane kód přímo podle kategorie a klíčová
# slova se ignorují. Důvod: obec je takto zaúčtovala jako agendu
# (např. všech 10 zápisů GDPR), i když popis zní obecně „právní služby".
# ──────────────────────────────────────────────────────────────────────
kategorie_lock:
  - "Bankovní poplatky"
  - "GDPR / pověřenec"
  - "Právní služby"
  - "Opravy/storna dokladů"

